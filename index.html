<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Zoom Misterioso</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#f6ecd6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Zoom Misterioso">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Special+Elite&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#f6ecd6; --card:#fffaf0; --white:#fffdf8; --ink:#3b2a1e; --muted:#8a6f58; --line:#e3d2b0;
    --mustard:#f2b632; --tomato:#e4572e; --teal:#2a9d8f; --sky:#d6ecf3;
    --ok:#2f9a58; --near:#d98a1c; --no:#d64545;
    --type:"Special Elite","Courier New",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;color:var(--ink);font:17px/1.4 "Fredoka",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
  body{min-height:100vh;background:var(--paper) radial-gradient(rgba(59,42,30,.09) 1.3px, transparent 1.5px) 0 0/20px 20px}
  .wrap{max-width:760px;margin:0 auto;padding:12px 14px 50px}

  /* ---------- header ---------- */
  header{margin-bottom:16px}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:10px}
  .logo{display:flex;align-items:center;gap:8px}
  .logo .mascot{width:52px}
  h1{font-size:25px;margin:0;font-weight:700;line-height:1;letter-spacing:.2px}
  h1 span{color:var(--tomato)}
  .hbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:10px}
  .chip{font-family:var(--type);background:var(--white);border:2.5px dashed var(--ink);border-radius:10px;padding:5px 10px;font-size:15px;white-space:nowrap}
  .chip b{font-family:"Fredoka";letter-spacing:3px;font-size:17px}

  h2{font-size:22px;margin:0 0 10px;font-weight:600;line-height:1.2}
  p{margin:0 0 10px}
  .muted{color:var(--muted)}
  .center{text-align:center}
  .type{font-family:var(--type)}

  /* ---------- card = fascicolo ---------- */
  .card{position:relative;background:var(--card);border:3px solid var(--ink);border-radius:22px;box-shadow:5px 5px 0 var(--ink);padding:18px;margin:0 0 20px}
  .card.tabbed{margin-top:26px;padding-top:24px}
  .tab{position:absolute;top:-17px;left:18px;background:var(--mustard);border:3px solid var(--ink);border-radius:10px 10px 5px 5px;padding:2px 12px;font-family:var(--type);font-size:14px;transform:rotate(-2deg);white-space:nowrap}
  .tab.red{background:var(--tomato);color:#fff}
  .tab.teal{background:var(--teal);color:#fff}

  /* ---------- controlli ---------- */
  label{display:block;font-size:15px;color:var(--muted);margin:12px 0 6px;font-weight:500}
  input[type=text],select{width:100%;padding:12px 14px;border-radius:14px;border:3px solid var(--ink);background:var(--white);color:var(--ink);font:500 18px "Fredoka",system-ui,sans-serif;outline:none;-webkit-appearance:none;appearance:none}
  select{background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 22px) 52%,calc(100% - 15px) 52%;background-size:7px 7px;background-repeat:no-repeat;padding-right:40px}
  input[type=text]:focus,select:focus{box-shadow:0 0 0 4px var(--mustard)}
  input::placeholder{color:#b9a58c}
  .code-input{text-transform:uppercase;letter-spacing:8px;font-weight:700 !important;text-align:center;font-size:24px !important}
  button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:3px solid var(--ink);border-radius:16px;padding:12px 18px;font:600 18px "Fredoka",system-ui,sans-serif;cursor:pointer;background:var(--mustard);color:var(--ink);text-decoration:none;white-space:nowrap;box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;-webkit-tap-highlight-color:transparent}
  button:active:not(:disabled),.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
  button:disabled{opacity:.45;cursor:not-allowed}
  button.sec,.btn.sec{background:var(--white)}
  button.red{background:var(--tomato);color:#fff}
  button.small{padding:6px 11px;font-size:15px;border-width:2.5px;border-radius:12px;box-shadow:0 3px 0 var(--ink)}
  button.icon{padding:6px 9px;font-size:17px}
  .full{width:100%}
  .row{display:flex;gap:10px;align-items:center}
  .row > *{flex:1}
  .or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:18px 0;font-size:15px}
  .or::before,.or::after{content:"";flex:1;border-top:2.5px dashed var(--line)}
  .spacer{height:12px}
  .grid2{display:grid;grid-template-columns:1fr;gap:0 10px}
  @media (min-width:520px){.grid2{grid-template-columns:1fr 1fr}}

  /* ---------- mascotte e fumetti ---------- */
  .mascot{display:block;margin:0 auto}
  .mascot svg{display:block;width:100%;height:auto;overflow:visible}
  .bob{animation:bob 2.6s ease-in-out infinite}
  .cheer{animation:cheer .5s ease-in-out infinite alternate}
  .peek{animation:peek 1.8s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-7px) rotate(-2deg)}}
  @keyframes cheer{from{transform:rotate(-7deg) translateY(0)}to{transform:rotate(7deg) translateY(-8px)}}
  @keyframes peek{0%,100%{transform:rotate(0)}30%{transform:rotate(-6deg)}60%{transform:rotate(5deg)}}
  .scene{display:flex;align-items:flex-end;gap:12px;justify-content:center;margin:4px 0 12px}
  .scene .mascot{flex:0 0 auto}
  .say{position:relative;background:var(--white);border:3px solid var(--ink);border-radius:18px;padding:10px 14px;font-weight:500;max-width:330px;margin-bottom:34px;box-shadow:3px 3px 0 var(--ink)}
  .say::after{content:"";position:absolute;left:-13px;bottom:14px;width:18px;height:18px;background:var(--white);border-left:3px solid var(--ink);border-bottom:3px solid var(--ink);transform:rotate(45deg) skew(10deg,10deg)}
  .steps{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 4px}
  .steps div{background:var(--white);border:2.5px solid var(--ink);border-radius:14px;padding:8px 6px;text-align:center;font-size:14px;line-height:1.25}
  .steps b{display:block;font-size:24px;margin-bottom:2px}

  /* ---------- giocatori e classifica ---------- */
  .players{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
  .pl{background:var(--white);border:2.5px solid var(--ink);border-radius:999px;padding:5px 12px;font-size:15px;font-weight:500}
  .pl.off{opacity:.4}
  .pl.done{background:#dcf1e2}
  .pl.wait{border-style:dashed}
  .scores{list-style:none;margin:0;padding:0}
  .scores li{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:9px 4px;border-bottom:2.5px dashed var(--line);font-weight:500}
  .scores li:last-child{border-bottom:0}
  .scores li.off{opacity:.45}
  .scores .pts{font-weight:700;font-size:19px}
  .rank{display:inline-flex;width:28px;height:28px;align-items:center;justify-content:center;border:2.5px solid var(--ink);border-radius:50%;background:var(--white);font-size:13px;font-weight:700;margin-right:6px;flex:0 0 auto}
  .rank.g1{background:var(--mustard)} .rank.g2{background:#d9dde3} .rank.g3{background:#e7a774}
  .kick{padding:2px 8px !important;margin-left:6px;font-size:12px !important;box-shadow:0 2px 0 var(--ink) !important}

  /* ---------- immagine / lente ---------- */
  .stage{position:relative;margin:0 auto;overflow:hidden;border-radius:20px;background:#2a211b;border:4px solid var(--ink);box-shadow:5px 5px 0 var(--ink);max-width:100%}
  .stage .img{position:absolute;inset:0;background-size:100% 100%;background-repeat:no-repeat;will-change:transform}
  .stage .vignette{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 52%,rgba(30,20,10,.5) 100%)}
  .stage.pick{cursor:crosshair}
  .marker{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;border:5px solid var(--mustard);border-radius:50%;box-shadow:0 0 0 3px var(--ink),inset 0 0 0 3px var(--ink);pointer-events:none;background:rgba(214,236,243,.25)}
  .marker::after{content:"";position:absolute;right:-19px;bottom:-19px;width:20px;height:7px;background:var(--ink);border-radius:4px;transform:rotate(45deg)}
  .bar{height:18px;background:var(--white);border:3px solid var(--ink);border-radius:999px;overflow:hidden;margin:16px 0 6px}
  .bar > div{height:100%;background:var(--mustard);width:100%;border-right:3px solid var(--ink)}
  .bar.low > div{background:var(--tomato)}
  .stat{display:flex;justify-content:space-between;font-size:15px;color:var(--muted);font-weight:500}
  .stat b{color:var(--ink);font-size:18px}
  .turn{display:inline-block;font-family:var(--type);font-size:14px;background:var(--sky);border:2.5px solid var(--ink);border-radius:999px;padding:3px 11px;margin-bottom:12px}

  .cdring{width:170px;height:170px;margin:18px auto;border-radius:50%;background:var(--sky);border:14px solid var(--mustard);box-shadow:0 0 0 4px var(--ink),inset 0 0 0 4px var(--ink),6px 6px 0 4px var(--ink);display:flex;align-items:center;justify-content:center;font-size:84px;font-weight:700;position:relative}
  .pop{animation:pop .35s ease-out}
  @keyframes pop{from{transform:scale(1.5);opacity:.3}to{transform:scale(1);opacity:1}}

  .guess{display:flex;gap:8px;margin-top:14px}
  .guess input{flex:1;min-width:0}
  .guess button{flex:0 0 auto}

  /* ---------- risposte e timbri ---------- */
  .glist{list-style:none;margin:10px 0 14px;padding:0}
  .glist li{position:relative;background:var(--white);border:2.5px solid var(--ink);border-radius:16px;padding:10px 12px;margin-bottom:10px}
  .glist .top{display:flex;justify-content:space-between;gap:8px;align-items:center}
  .glist .txt{font-size:19px;font-weight:600;word-break:break-word;margin-top:2px}
  .marks{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:10px}
  .marks button{background:var(--white);font-size:14px;padding:8px 4px;border-width:2.5px;box-shadow:0 3px 0 var(--ink)}
  .marks button.on.ok{background:#cdeed8}
  .marks button.on.near{background:#fbe2b8}
  .marks button.on.no{background:#f6cccc}
  .stamp{display:inline-block;font-family:var(--type);text-transform:uppercase;border:3px double currentColor;padding:2px 8px;border-radius:6px;transform:rotate(-7deg);font-size:14px;letter-spacing:1px;background:rgba(255,255,255,.6);white-space:nowrap}
  .stamp.ok{color:var(--ok)} .stamp.near{color:var(--near)} .stamp.no{color:var(--no)}
  .stamp.big{font-size:22px;padding:4px 14px;border-width:4px}
  .stamp-in{animation:stamp .4s cubic-bezier(.3,1.6,.6,1)}
  @keyframes stamp{from{transform:scale(2.2) rotate(-14deg);opacity:0}to{transform:scale(1) rotate(-7deg);opacity:1}}
  .gain{font-weight:700;font-size:18px}
  .gain.ok{color:var(--ok)} .gain.near{color:var(--near)} .gain.no{color:var(--no)}
  .answer{font-size:24px;font-weight:700;color:var(--tomato)}
  .note{background:var(--sky);border:2.5px solid var(--ink);border-radius:14px;padding:10px 12px;font-size:15px;margin-top:12px}
  .err{background:#f9d5d5;border:2.5px solid var(--no);border-radius:14px;padding:10px 12px;margin-top:12px}
  .file-btn{position:relative;overflow:hidden}
  .file-btn input{position:absolute;inset:0;opacity:0;cursor:pointer}
  .two{display:grid;grid-template-columns:1fr;gap:12px}
  @media (min-width:640px){.two{grid-template-columns:2fr 1fr}}
  .mini-title{font-size:14px;color:var(--muted);margin:0 0 6px;font-weight:500}

  /* ---------- podio finale ---------- */
  .podium{display:flex;align-items:flex-end;justify-content:center;gap:8px;margin:16px 0 8px}
  .podium .col{flex:1;max-width:150px;text-align:center}
  .podium .who{font-weight:600;font-size:16px;word-break:break-word;margin-bottom:4px}
  .podium .medal{font-size:30px;line-height:1}
  .podium .block{border:3px solid var(--ink);border-radius:14px 14px 4px 4px;box-shadow:4px 4px 0 var(--ink);display:flex;align-items:flex-start;justify-content:center;padding-top:8px;font-weight:700;font-size:22px}
  .podium .p1 .block{height:120px;background:var(--mustard)}
  .podium .p2 .block{height:88px;background:#d9dde3}
  .podium .p3 .block{height:64px;background:#e7a774}
  .rise{animation:rise .6s ease-out both}
  @keyframes rise{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}

  .toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:var(--white);border:3px solid var(--ink);box-shadow:4px 4px 0 var(--ink);padding:10px 16px;border-radius:14px;opacity:0;transition:all .2s;pointer-events:none;font-weight:500;max-width:90vw;text-align:center;z-index:20}
  .toast.show{opacity:1;transform:translateX(-50%)}
  canvas.confetti{position:fixed;inset:0;width:100vw;height:100vh;pointer-events:none;z-index:30}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="logo"><div class="mascot" id="logoMascot"></div><h1>Zoom <span>Misterioso</span></h1></div>
      <button class="sec small icon" id="muteBtn" onclick="toggleMute()" title="Suoni">🔊</button>
    </div>
    <div class="hbar" id="hdr"></div>
  </header>
  <div id="main"></div>
  <div id="side"></div>
</div>
<div class="toast" id="toast"></div>

<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
"use strict";
/* ============ Costanti ============ */
const PREFIX = "zoommisterioso-v1-";
const ZOOM_MAX = 8;          // ingrandimento iniziale
const GRACE_MS = 5000;       // secondi extra a immagine intera
const COUNTDOWN_MS = 3000;
const MAX_SIDE = 1200;       // lato massimo immagine (px)

/* ============ Utilità ============ */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clamp = (x,a,b) => Math.max(a, Math.min(b, x));
const rid = (n=8) => Math.random().toString(36).slice(2, 2+n);
const secs = ms => (ms/1000).toFixed(1).replace(".", ",") + " s";
function points(mark, t, dur){
  const f = clamp(1 - t/dur, 0, 1);
  if (mark === "ok") return 50 + Math.round(50*f);
  if (mark === "near") return 20 + Math.round(20*f);
  return 0;
}
function toast(msg){
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast._t); toast._t = setTimeout(()=>t.classList.remove("show"), 2200);
}
function store(k, v){ try{ if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); }catch(e){ return null; } }

/* ============ Stato locale ============ */
let me = { id:null, name:"", isHost:false, code:"" };
let peer = null;
let hostConn = null;             // lato giocatore
const conns = new Map();         // lato host: peerId -> {conn, pid}
let G = null;                    // stato completo (solo host)
let V = null;                    // vista corrente
const images = {};               // n. turno -> dataURL
let zoomAnchor = { key:null, start:0 };
let cdAnchor = { key:null, end:0 };
let screenKey = "";
let draft = null;                // bozza upload del lead
let judgeMarks = {};
let homeError = "";
let connecting = false;
let migrating = false;           // l'host sta passando a un altro giocatore
let leaving = false;             // sto uscendo volontariamente

/* ============================================================
   HOST: logica di gioco
   ============================================================ */
function hostInit(code){
  G = { code, phase:"lobby", duration:30000, giri:2, round:0, turnNo:0, r:null,
        players:[{ id:"host", name:me.name, score:0, online:true, led:0 }] };
  me.id = "host"; me.isHost = true; me.code = code;
  broadcast();
}

window.addEventListener("beforeunload", e => {
  if (me.isHost && G && G.players.filter(p => p.online).length > 1){ e.preventDefault(); e.returnValue = ""; }
});

/* Rimuove un giocatore dalla partita (uscita volontaria o tolto dall'host) */
function removePlayer(pid, why){
  const idx = G.players.findIndex(p => p.id === pid);
  if (idx < 0 || pid === "host") return;
  const [p] = G.players.splice(idx, 1);
  for (const [k, e] of conns) if (e.pid === pid){
    e.pid = null;
    if (why === "kick") safeSend(e.conn, { type:"kicked" });
    setTimeout(() => { try{ e.conn.close(); }catch(_){} }, 300);
    conns.delete(k);
  }
  notice(`${p.name} ${why === "kick" ? "è stato tolto dalla partita" : "è uscito dalla partita"}`);
  const r = G.r;
  if (G.phase !== "lobby" && onlinePlayers().length < 2){
    if (r) clearTimeout(r.timer);
    G.phase = "lobby"; G.r = null;
    notice("Siete rimasti in pochi: si torna in sala d'attesa");
    broadcast(); return;
  }
  if (r && r.leadId === pid && G.phase !== "results" && G.phase !== "lobby"){
    notice("Turno annullato, si passa al prossimo");
    nextRound(false, idx - 1); return;
  }
  if (G.phase === "zoom" && checkAllGuessed()) return;
  broadcast();
}

function notice(text){
  for (const e of conns.values()) if (e.pid) safeSend(e.conn, { type:"notice", text });
  toast(text);
}

/* L'host se ne va: passa il ruolo a un altro giocatore */
function hostHandover(){
  const heir = G.players.find(p => p.id !== "host" && p.online);
  const heirEntry = heir && [...conns.values()].find(e => e.pid === heir.id);
  if (!heir || !heirEntry) return false;
  if (G.r) clearTimeout(G.r.timer);
  const snap = {
    code:G.code, duration:G.duration, giri:G.giri, round:G.round, turnNo:G.turnNo,
    phase: G.phase === "lobby" || G.phase === "final" ? G.phase : "playing",
    players: G.players.filter(p => p.id !== "host").map(p => ({
      id: p.id === heir.id ? "host" : p.id, name:p.name, score:p.score, online: p.id === heir.id, led:p.led || 0
    }))
  };
  safeSend(heirEntry.conn, { type:"becomeHost", snap });
  for (const e of conns.values()) if (e.pid && e.pid !== heir.id) safeSend(e.conn, { type:"migrating", newHost:heir.name });
  return true;
}

/* Il nuovo host riceve lo stato e riapre la stanza con lo stesso codice */
function becomeHost(snap){
  migrating = true;
  try{ hostConn && hostConn.close(); }catch(_){}
  try{ peer && peer.destroy(); }catch(_){}
  hostConn = null;
  V = Object.assign({}, V || {}, { phase:"migrating", newHost:"te" }); screenKey = ""; render();
  let tries = 0;
  const attempt = () => {
    const p = new Peer(PREFIX + snap.code);
    p.on("open", () => {
      peer = p; migrating = false;
      me.id = "host"; me.isHost = true; me.code = snap.code;
      G = { code:snap.code, phase:"lobby", duration:snap.duration, giri:snap.giri || 2, round:snap.round,
            turnNo:snap.turnNo || 0, r:null, players:snap.players };
      if (snap.phase === "final"){ G.phase = "final"; broadcast(); }
      else if (snap.phase !== "lobby") nextRound(true); else broadcast();
      toast("Ora sei tu l'host: tieni la pagina aperta!");
    });
    p.on("connection", hostOnConnection);
    p.on("disconnected", () => { try{ p.reconnect(); }catch(e){} });
    p.on("error", err => {
      if (G && me.isHost){ console.warn(err); return; }
      try{ p.destroy(); }catch(_){}
      if (++tries < 15) setTimeout(attempt, 1500);
      else { V = Object.assign({}, V, { phase:"lost" }); screenKey = ""; render(); }
    });
  };
  setTimeout(attempt, 1200);
}

function hostOnConnection(conn){
  conn.on("open", () => { if (!conns.has(conn.peer)) conns.set(conn.peer, { conn, pid:null }); });
  conn.on("data", d => hostOnData(conn, d));
  conn.on("close", () => hostOnClose(conn));
  conn.on("error", () => hostOnClose(conn));
}

function hostOnData(conn, msg){
  if (!msg || typeof msg !== "object" || !G || !me.isHost) return;
  let entry = conns.get(conn.peer);
  if (!entry){ entry = { conn, pid:null }; conns.set(conn.peer, entry); }
  if (msg.type === "join"){
    let name = String(msg.name || "").trim().slice(0, 20) || "Giocatore";
    let p = G.players.find(x => x.name.toLowerCase() === name.toLowerCase() && !x.online && x.id !== "host");
    if (!p){
      const base = name; let i = 2;
      while (G.players.some(x => x.name.toLowerCase() === name.toLowerCase())) name = base + " " + (i++);
      p = { id:"p" + rid(), name, score:0, online:true, led:0 };
      G.players.push(p);
    }
    p.online = true;
    entry.pid = p.id;
    safeSend(conn, { type:"welcome", pid:p.id, code:G.code });
    if (G.r && G.r.image && G.phase !== "upload") safeSend(conn, { type:"image", n:G.r.n, data:G.r.image });
    broadcast();
    return;
  }
  if (!entry.pid) return;
  act(entry.pid, msg);
}

function hostOnClose(conn){
  if (!G || !me.isHost) return;
  const entry = conns.get(conn.peer);
  conns.delete(conn.peer);
  if (!entry || !entry.pid) return;
  const p = G.players.find(x => x.id === entry.pid);
  if (p) p.online = false;
  if (G.r && G.r.leadId === entry.pid && G.phase === "upload") { nextRound(); return; }
  if (G.phase === "zoom") checkAllGuessed();
  broadcast();
}

function act(pid, msg){
  const r = G.r, now = Date.now();
  switch (msg.type){
    case "start":
      if (pid !== "host" || G.phase !== "lobby" || onlinePlayers().length < 2) return;
      G.players = G.players.filter(p => p.online);
      for (const p of G.players){ p.score = 0; p.led = 0; }
      G.turnNo = 0; G.r = null; nextRound(true); return;
    case "duration":
      if (pid !== "host" || G.phase !== "lobby") return;
      G.duration = clamp(Number(msg.ms) || 30000, 10000, 90000); break;
    case "giri":
      if (pid !== "host" || G.phase !== "lobby") return;
      G.giri = clamp(Math.round(Number(msg.n) || 1), 1, 5); break;
    case "newGame":
      if (pid !== "host" || G.phase !== "final") return;
      for (const p of G.players){ p.score = 0; p.led = 0; }
      G.turnNo = 0; G.r = null; G.phase = "lobby"; break;
    case "upload":
      if (G.phase !== "upload" || !r || r.leadId !== pid) return;
      if (typeof msg.image !== "string" || !msg.image.startsWith("data:image/")) return;
      Object.assign(r, {
        image: msg.image, w: Number(msg.w)||1, h: Number(msg.h)||1,
        fx: clamp(Number(msg.fx), 0, 1), fy: clamp(Number(msg.fy), 0, 1),
        answer: String(msg.answer || "").trim().slice(0, 60)
      });
      images[r.n] = r.image;
      for (const e of conns.values()) if (e.pid) safeSend(e.conn, { type:"image", n:r.n, data:r.image });
      G.phase = "countdown"; r.countdownEnd = now + COUNTDOWN_MS;
      r.timer = setTimeout(startZoom, COUNTDOWN_MS);
      break;
    case "guess":
      if (G.phase !== "zoom" || !r || pid === r.leadId || r.guesses[pid]) return;
      { const text = String(msg.text || "").trim().slice(0, 60); if (!text) return;
        r.guesses[pid] = { text, t: now - r.start, name:(G.players.find(p => p.id === pid) || {}).name }; }
      if (checkAllGuessed()) return;
      break;
    case "judge":
      if (G.phase !== "judge" || !r || r.leadId !== pid) return;
      for (const gp of Object.keys(r.guesses)){
        const m = (msg.marks || {})[gp];
        const mark = (m === "ok" || m === "near") ? m : "no";
        r.marks[gp] = mark;
        r.points[gp] = points(mark, r.guesses[gp].t, G.duration);
        const p = G.players.find(x => x.id === gp); if (p) p.score += r.points[gp];
      }
      G.phase = "results";
      break;
    case "next":
      if (G.phase !== "results" || !r || (pid !== r.leadId && pid !== "host")) return;
      nextRound(); return;
    case "skip":
      if (pid !== "host" || ["lobby","results","final"].includes(G.phase)) return;
      nextRound(); return;
    case "leave":
      if (pid === "host") return;
      removePlayer(pid, "leave"); return;
    case "kick":
      if (pid !== "host" || msg.pid === "host") return;
      removePlayer(msg.pid, "kick"); return;
    default: return;
  }
  broadcast();
}

function onlinePlayers(){ return G.players.filter(p => p.online); }

function remainingTurns(){
  return onlinePlayers().reduce((a, p) => a + Math.max(0, G.giri - (p.led || 0)), 0);
}

function nextRound(first, fromIdx){
  if (G.r) clearTimeout(G.r.timer);
  const list = G.players;
  const online = list.filter(p => p.online);
  if (!online.length) return;
  const minLed = Math.min(...online.map(p => p.led || 0));
  if (minLed >= G.giri){ G.phase = "final"; G.r = null; broadcast(); return; }
  let idx = -1;
  if (fromIdx !== undefined) idx = fromIdx;
  else if (!first && G.r){ idx = list.findIndex(p => p.id === G.r.leadId); }
  let lead = null;
  for (let k = 1; k <= list.length; k++){
    const p = list[(idx + k + list.length) % list.length];
    if (p.online && (p.led || 0) === minLed){ lead = p; break; }
  }
  if (!lead) lead = online[0];
  lead.led = (lead.led || 0) + 1;
  G.turnNo = (G.turnNo || 0) + 1;
  G.round++;
  G.r = { n:G.round, leadId:lead.id, guesses:{}, marks:{}, points:{} };
  G.phase = "upload";
  broadcast();
}

function startZoom(){
  const r = G.r; if (!r || G.phase !== "countdown") return;
  G.phase = "zoom"; r.start = Date.now();
  r.timer = setTimeout(endGuessing, G.duration + GRACE_MS);
  broadcast();
}

function checkAllGuessed(){
  const r = G.r;
  const need = onlinePlayers().filter(p => p.id !== r.leadId);
  if (need.length && need.every(p => r.guesses[p.id])){ endGuessing(); return true; }
  return false;
}

function endGuessing(){
  const r = G.r; if (!r || G.phase !== "zoom") return;
  clearTimeout(r.timer);
  G.phase = "judge";
  broadcast();
}

function viewFor(pid){
  const r = G.r, now = Date.now();
  const isLead = !!r && r.leadId === pid;
  const reveal = G.phase === "results";
  let round = null;
  if (r){
    const guessList = Object.entries(r.guesses).map(([id, g]) => ({
      id, name:(G.players.find(p => p.id === id) || {}).name || g.name || "?", text:g.text, t:g.t,
      mark: reveal ? r.marks[id] : undefined, pts: reveal ? r.points[id] : undefined
    })).sort((a,b) => a.t - b.t);
    round = {
      n:r.n, leadId:r.leadId, hasImage:!!r.image, w:r.w, h:r.h,
      fx: r.image ? r.fx : null, fy: r.image ? r.fy : null,
      answer: (isLead || reveal) ? (r.answer || "") : null,
      countdownLeft: G.phase === "countdown" ? Math.max(0, r.countdownEnd - now) : 0,
      elapsed: G.phase === "zoom" ? now - r.start : 0,
      guessed: Object.keys(r.guesses),
      myGuess: r.guesses[pid] ? { text:r.guesses[pid].text, t:r.guesses[pid].t } : null,
      guesses: ((isLead && G.phase === "judge") || reveal) ? guessList : null
    };
  }
  const left = remainingTurns();
  return { code:G.code, phase:G.phase, you:pid, isHost:pid === "host", duration:G.duration,
           giri:G.giri, turnNo:G.turnNo, totalTurns:G.turnNo + left, isLast: G.phase === "results" && left === 0,
           players:G.players.map(p => ({ id:p.id, name:p.name, score:p.score, online:p.online })), round };
}

function broadcast(){
  for (const e of conns.values()) if (e.pid) safeSend(e.conn, { type:"state", v:viewFor(e.pid) });
  applyView(viewFor("host"));
}

function safeSend(conn, msg){ try{ if (conn.open) conn.send(msg); }catch(e){ console.warn(e); } }

/* ============================================================
   RETE: crea / entra
   ============================================================ */
function peerAvailable(){
  if (typeof window.Peer === "undefined"){
    homeError = "Non riesco a caricare la libreria di rete (PeerJS). Controlla la connessione internet e ricarica la pagina.";
    renderHome(); return false;
  }
  return true;
}

function createGame(){
  const name = ($("#name").value || "").trim();
  if (!name){ $("#name").focus(); toast("Scrivi il tuo nome"); return; }
  if (!peerAvailable()) return;
  me.name = name; store("zm-name", name);
  connecting = true; homeError = ""; renderHome();
  const letters = "ABCDEFGHJKLMNPQRSTUVWXYZ";
  const tryCode = (attempt) => {
    const code = Array.from({length:4}, () => letters[Math.floor(Math.random()*letters.length)]).join("");
    const p = new Peer(PREFIX + code);
    p.on("open", () => { peer = p; hostInit(code); });
    p.on("connection", hostOnConnection);
    p.on("disconnected", () => { try{ p.reconnect(); }catch(e){} });
    p.on("error", err => {
      if (err && err.type === "unavailable-id" && attempt < 5){ p.destroy(); tryCode(attempt+1); return; }
      if (G){ console.warn(err); return; }
      connecting = false; homeError = "Errore di connessione: " + (err && err.type || err); renderHome();
    });
  };
  tryCode(0);
}

function joinGame(){
  const name = ($("#name").value || "").trim();
  const code = ($("#code").value || "").trim().toUpperCase();
  if (!name){ $("#name").focus(); toast("Scrivi il tuo nome"); return; }
  if (code.length !== 4){ $("#code").focus(); toast("Il codice ha 4 lettere"); return; }
  if (!peerAvailable()) return;
  me.name = name; me.code = code; store("zm-name", name);
  connecting = true; homeError = ""; renderHome();
  connectToHost();
}

function connectToHost(retries = 0){
  if (peer){ try{ peer.destroy(); }catch(e){} }
  leaving = false;
  let welcomed = false, done = false;
  const p = new Peer();
  peer = p;
  const fail = (msg) => {
    if (welcomed || done) return;
    done = true; clearTimeout(timeout);
    if (retries > 0 && !leaving){ try{ p.destroy(); }catch(_){} setTimeout(() => connectToHost(retries - 1), 2000); return; }
    migrating = false;
    connecting = false; homeError = msg; V = null; screenKey = ""; renderHome();
  };
  const timeout = setTimeout(() => fail("Non riesco a raggiungere la stanza " + me.code + ". Controlla il codice o che l'host abbia la pagina aperta."), retries > 0 ? 6000 : 15000);
  p.on("open", () => {
    const c = p.connect(PREFIX + me.code, { reliable:true });
    hostConn = c;
    c.on("open", () => c.send({ type:"join", name:me.name }));
    c.on("data", msg => {
      if (!msg || c !== hostConn) return;
      switch (msg.type){
        case "welcome": welcomed = true; clearTimeout(timeout); me.id = msg.pid; connecting = false; migrating = false; break;
        case "state": applyView(msg.v); break;
        case "image": images[msg.n] = msg.data; screenKey = ""; render(); break;
        case "notice": toast(msg.text); break;
        case "kicked":
          leaving = true;
          V = Object.assign({}, V, { phase:"left", kicked:true }); screenKey = ""; render(); break;
        case "migrating":
          migrating = true;
          V = Object.assign({}, V, { phase:"migrating", newHost:msg.newHost }); screenKey = ""; render();
          hostConn = null;
          try{ c.close(); }catch(_){}
          setTimeout(() => connectToHost(12), 2500);
          break;
        case "becomeHost": becomeHost(msg.snap); break;
      }
    });
    c.on("close", () => { if (c === hostConn) lostHost(); });
    c.on("error", () => { if (c === hostConn) lostHost(); });
  });
  p.on("error", err => {
    if (err && err.type === "peer-unavailable"){ fail("Stanza " + me.code + " non trovata. Controlla il codice."); return; }
    if (!welcomed) fail("Errore di connessione: " + (err && err.type || err));
    else console.warn(err);
  });
}

/* Pulsante "Esci" */
function leaveGame(){
  if (me.isHost){
    const others = G.players.filter(p => p.id !== "host" && p.online);
    if (others.length){
      if (!confirm(`Vuoi uscire? Il ruolo di host passerà a ${others[0].name} e la partita continuerà senza di te.`)) return;
      hostHandover();
    } else if (!confirm("Vuoi chiudere la partita?")) return;
    leaving = true;
    setTimeout(() => {
      try{ peer && peer.destroy(); }catch(_){}
      G = null; me.isHost = false; conns.clear();
      V = { phase:"left", code:me.code, players:[], round:null }; screenKey = ""; render();
    }, 600);
    return;
  }
  if (!confirm("Vuoi uscire dalla partita? Gli altri continueranno a giocare.")) return;
  leaving = true;
  send({ type:"leave" });
  setTimeout(() => {
    const c = hostConn; hostConn = null;
    try{ c && c.close(); }catch(_){}
    try{ peer && peer.destroy(); }catch(_){}
  }, 400);
  V = Object.assign({}, V, { phase:"left" }); screenKey = ""; render();
}

function kickPlayer(pid, name){
  if (confirm(`Togliere ${name} dalla partita?`)) send({ type:"kick", pid });
}

function goHome(){
  V = null; screenKey = ""; connecting = false; homeError = ""; leaving = false;
  history.replaceState(null, "", location.href.split("?")[0]);
  renderHome();
}

function lostHost(){
  if (!V || leaving || migrating) return;
  V = Object.assign({}, V, { phase:"lost" });
  screenKey = ""; render();
}

function send(msg){
  if (me.isHost) act("host", msg);
  else if (hostConn && hostConn.open) hostConn.send(msg);
  else toast("Non sei connesso");
}

   SUONI (generati al volo, niente file)
   ============================================================ */
const sfx = (() => {
  let ctx = null, muted = store("zm-mute") === "1";
  function ac(){
    if (!ctx){ const C = window.AudioContext || window.webkitAudioContext; if (!C) return null; ctx = new C(); }
    if (ctx.state === "suspended") ctx.resume();
    return ctx;
  }
  function tone(freq, dur, { type = "sine", vol = .18, at = 0, slide = null } = {}){
    if (muted) return;
    const c = ac(); if (!c) return;
    try{
      const t0 = c.currentTime + at, o = c.createOscillator(), g = c.createGain();
      o.type = type; o.frequency.setValueAtTime(freq, t0);
      if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
      g.gain.setValueAtTime(.0001, t0);
      g.gain.exponentialRampToValueAtTime(vol, t0 + .015);
      g.gain.exponentialRampToValueAtTime(.0001, t0 + dur);
      o.connect(g); g.connect(c.destination);
      o.start(t0); o.stop(t0 + dur + .03);
    }catch(e){}
  }
  const seq = (fs, step, opt = {}) => fs.forEach((f, i) => tone(f, step * 1.7, { ...opt, at:(opt.at || 0) + i * step }));
  return {
    unlock(){ if (!muted) ac(); },
    get muted(){ return muted; },
    toggle(){ muted = !muted; store("zm-mute", muted ? "1" : "0"); if (!muted) seq([660, 990], .07, { type:"triangle", vol:.15 }); return muted; },
    tick(){ tone(1500, .05, { type:"square", vol:.05 }); },
    beep(){ tone(660, .16, { type:"triangle", vol:.2 }); },
    go(){ tone(990, .4, { type:"triangle", vol:.22, slide:1320 }); },
    ding(){ seq([988, 1319], .08, { type:"triangle", vol:.12 }); },
    send(){ tone(440, .14, { type:"sine", vol:.22, slide:880 }); },
    join(){ seq([660, 990], .07, { type:"sine", vol:.14 }); },
    yourTurn(){ seq([523, 659, 784], .1, { type:"triangle", vol:.16 }); },
    timeup(){ seq([784, 587, 392], .12, { type:"square", vol:.06 }); },
    win(){ seq([523, 659, 784, 1047], .1, { type:"triangle", vol:.2 }); },
    near(){ seq([659, 784], .13, { type:"triangle", vol:.16 }); },
    fail(){ tone(392, .55, { type:"sawtooth", vol:.07, slide:180 }); },
    reveal(){ seq([587, 784], .12, { type:"triangle", vol:.14 }); },
    fanfare(){
      seq([523, 523, 523, 659, 784, 659, 784, 1047], .13, { type:"triangle", vol:.2 });
      [523, 659, 784, 1047].forEach(f => tone(f, 1.4, { type:"triangle", vol:.08, at:1.15 }));
    }
  };
})();
document.addEventListener("pointerdown", () => sfx.unlock(), { passive:true });
function toggleMute(){ const m = sfx.toggle(); $("#muteBtn").textContent = m ? "🔇" : "🔊"; }

/* ============================================================
   CORIANDOLI
   ============================================================ */
const confetti = (() => {
  let cv = null, cx = null, parts = [], running = false;
  const colors = ["#f2b632", "#e4572e", "#2a9d8f", "#2f9a58", "#7bb6e8", "#f08bb0", "#3b2a1e"];
  function setup(){
    if (cv) return;
    cv = document.createElement("canvas"); cv.className = "confetti"; document.body.appendChild(cv);
    cx = cv.getContext("2d"); resize(); addEventListener("resize", resize);
  }
  function resize(){ if (cv){ cv.width = innerWidth * devicePixelRatio; cv.height = innerHeight * devicePixelRatio; } }
  function burst(n = 120, fromTop = false){
    setup();
    const W = innerWidth, H = innerHeight;
    for (let i = 0; i < n; i++){
      parts.push({
        x: fromTop ? Math.random() * W : W / 2 + (Math.random() - .5) * 60,
        y: fromTop ? -20 - Math.random() * H * .4 : H * .5,
        vx: fromTop ? (Math.random() - .5) * 3 : (Math.random() - .5) * 16,
        vy: fromTop ? Math.random() * 2 + 1 : -Math.random() * 15 - 5,
        r: Math.random() * Math.PI, vr: (Math.random() - .5) * .3,
        w: 7 + Math.random() * 6, h: 9 + Math.random() * 8,
        c: colors[(Math.random() * colors.length) | 0], t: Math.random() * 10, life: 0
      });
    }
    if (!running){ running = true; requestAnimationFrame(step); }
  }
  function step(){
    const d = devicePixelRatio;
    cx.clearRect(0, 0, cv.width, cv.height);
    parts = parts.filter(p => p.y < innerHeight + 40 && p.life < 700);
    for (const p of parts){
      p.vy = Math.min(p.vy + .28, 5.5); p.vx *= .985;
      p.x += p.vx + Math.sin((p.life + p.t) * .08) * .6; p.y += p.vy; p.r += p.vr; p.life++;
      const flip = Math.abs(Math.cos((p.life + p.t) * .12));
      cx.save(); cx.translate(p.x * d, p.y * d); cx.rotate(p.r);
      cx.fillStyle = p.c; cx.fillRect(-p.w * d / 2, -p.h * d * flip / 2, p.w * d, p.h * d * flip + 1);
      cx.restore();
    }
    if (parts.length) requestAnimationFrame(step);
    else { running = false; cx.clearRect(0, 0, cv.width, cv.height); }
  }
  return {
    small(){ burst(70); },
    big(){ burst(130); setTimeout(() => burst(150, true), 400); setTimeout(() => burst(120, true), 1400); }
  };
})();

/* ============================================================
   VISTA
   ============================================================ */
function applyView(v){
  const prev = V;
  V = v;
  const r = v.round;
  if (v.phase === "zoom" && r){
    const key = "z" + r.n, start = performance.now() - r.elapsed;
    if (zoomAnchor.key !== key || Math.abs(zoomAnchor.start - start) > 400) zoomAnchor = { key, start };
  }
  if (v.phase === "countdown" && r){
    const key = "c" + r.n, end = performance.now() + r.countdownLeft;
    if (cdAnchor.key !== key || Math.abs(cdAnchor.end - end) > 400) cdAnchor = { key, end };
  }
  try{ playEvents(prev, v); }catch(e){ console.warn(e); }
  render();
}

function playEvents(prev, v){
  if (!prev || !prev.players) return;
  const r = v.round, pr = prev.round;
  const onl = x => x.players.filter(p => p.online).length;
  if (v.phase === "lobby" && prev.phase === "lobby" && onl(v) > onl(prev)) sfx.join();
  if (v.phase === "upload" && r && r.leadId === v.you && !(prev.phase === "upload" && pr && pr.n === r.n)) sfx.yourTurn();
  if (v.phase === "zoom" && prev.phase === "countdown") sfx.go();
  if (v.phase === "zoom" && r && pr && pr.n === r.n && r.guessed.length > pr.guessed.length){
    if (r.myGuess && !pr.myGuess) sfx.send(); else sfx.ding();
  }
  if (v.phase === "judge" && prev.phase === "zoom") sfx.timeup();
  if (v.phase === "results" && prev.phase !== "results" && r){
    const mine = (r.guesses || []).find(g => g.id === v.you);
    if (mine && mine.mark === "ok"){ sfx.win(); confetti.small(); }
    else if (mine && mine.mark === "near") sfx.near();
    else if (mine) sfx.fail();
    else sfx.reveal();
  }
  if (v.phase === "final" && prev.phase !== "final"){ sfx.fanfare(); confetti.big(); }
}

const playerName = id => (V.players.find(p => p.id === id) || {}).name || "?";

function render(){
  if (!V){ renderHome(); return; }
  const r = V.round;
  const isLead = !!r && r.leadId === V.you;
  const key = [V.phase, r && r.n, isLead, !!(r && r.myGuess), !!(r && images[r.n]), V.isHost].join("|");
  if (key !== screenKey){ screenKey = key; buildScreen(); }
  updateDynamic();
}

function header(){
  const hdr = $("#hdr");
  if (!V || ["left","lost","migrating"].includes(V.phase)){ hdr.innerHTML = ""; return; }
  hdr.innerHTML = `<span class="chip" title="Codice stanza">CASO #<b id="roomCode">${esc(V.code)}</b></span>
    <button class="sec small" onclick="copyLink()">🔗 Invita</button>
    <button class="sec small" onclick="leaveGame()">🚪 Esci</button>`;
}

function inviteLink(){
  const base = location.href.split("?")[0].split("#")[0];
  return base + "?stanza=" + V.code;
}
function copyLink(){
  const link = inviteLink();
  const done = () => toast("Link copiato! Incollalo nella chat di Meet");
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(link).then(done, () => prompt("Copia questo link:", link));
  else prompt("Copia questo link:", link);
}

/* ---------- Home ---------- */
function renderHome(){
  header();
  $("#side").innerHTML = "";
  const params = new URLSearchParams(location.search);
  const preCode = (params.get("stanza") || "").toUpperCase().slice(0,4);
  const prevName = ($("#name") && $("#name").value) || store("zm-name") || "";
  const prevCode = ($("#code") && $("#code").value) || preCode;
  const joinFirst = !!preCode;
  const joinBox = `
    <label for="code">Codice del caso</label>
    <input id="code" class="code-input" type="text" maxlength="4" autocomplete="off" value="${esc(prevCode)}" placeholder="ABCD">
    <div class="spacer"></div>
    <button class="full ${joinFirst ? "" : "sec"}" onclick="joinGame()" ${connecting ? "disabled" : ""}>🔍 Entra nella partita</button>`;
  const createBox = `<button class="full ${joinFirst ? "sec" : ""}" onclick="createGame()" ${connecting ? "disabled" : ""}>✨ Crea una nuova partita</button>`;
  $("#main").innerHTML = `
    <div class="card">
      ${scene(130, "bob", joinFirst ? "Ti hanno invitato a un caso! Scrivi il tuo nome ed entra 🕵️" : "Ciao detective! Pronto a scoprire cosa si nasconde dietro un dettaglio?")}
      <div class="steps">
        <div><b>📷</b>A turno qualcuno sceglie una foto</div>
        <div><b>🔍</b>Parte super ingrandita e si allarga</div>
        <div><b>🏆</b>Chi indovina prima fa più punti</div>
      </div>
      <label for="name">Il tuo nome da detective</label>
      <input id="name" type="text" maxlength="20" autocomplete="off" value="${esc(prevName)}" placeholder="Es. Giulia">
      <div class="spacer"></div>
      ${joinFirst ? joinBox + `<div class="or">oppure</div>` + createBox : createBox + `<div class="or">oppure entra con un codice</div>` + joinBox}
      ${connecting ? `<p class="center muted" style="margin-top:12px">Connessione in corso…</p>` : ""}
      ${homeError ? `<div class="err">${esc(homeError)}</div>` : ""}
    </div>`;

/* ---------- Schermate di gioco ---------- */
function turnPill(){
  return V.turnNo ? `<span class="turn">Turno ${V.turnNo} di ${Math.max(V.turnNo, V.totalTurns)}</span>` : "";
}
function giriLabel(n, players){
  return `${n} ${n === 1 ? "giro" : "giri"} · ${n * Math.max(players, 1)} turni`;
}

function buildScreen(){
  header();
  const r = V.round;
  const isLead = !!r && r.leadId === V.you;
  const lead = r ? esc(playerName(r.leadId)) : "";
  const hostSkip = (V.isHost && !isLead && ["upload","countdown","zoom","judge"].includes(V.phase))
      ? `<div class="spacer"></div><div class="center"><button class="sec small" onclick="if(confirm('Saltare questo turno?')) send({type:'skip'})">⏭ Salta turno (host)</button></div>` : "";
  let html = "";

  switch (V.phase){
    case "left":
      html = `<div class="card center">
        ${scene(110, "peek", V.kicked ? "L'host ti ha tolto dalla partita." : "A presto, detective! 👋")}
        <h2>${V.kicked ? "Sei stato tolto dalla partita" : "Sei uscito dalla partita"}</h2>
        <p class="muted">${V.kicked ? "Puoi sempre crearne una nuova." : "Gli altri possono continuare a giocare senza di te."}</p>
        ${V.code && !me.isHost && !V.kicked ? `<button onclick="reconnect()">↩️ Rientra nella stanza ${esc(V.code)}</button><div class="spacer"></div>` : ""}
        <button class="sec" onclick="goHome()">Torna all'inizio</button></div>`;
      break;

    case "migrating":
      html = `<div class="card center">
        ${scene(110, "peek", V.newHost === "te" ? "Ora il capo della squadra sei tu!" : "Un attimo, cambio di comando…")}
        <h2>🔄 Cambio host…</h2>
        <p class="muted">${V.newHost === "te" ? "L'host è uscito e <b>ora sei tu l'host</b>. Sto riaprendo la stanza: tieni questa pagina aperta!" : `L'host è uscito: <b>${esc(V.newHost)}</b> diventa il nuovo host. Mi ricollego in automatico, i punti restano.`}</p></div>`;
      break;

    case "lost":
      html = `<div class="card center">
        ${scene(110, "peek", "Ehi… dove sono finiti tutti?")}
        <h2>Connessione persa 😕</h2>
        <p class="muted">Non sei più collegato all'host. Se la sua pagina è ancora aperta puoi rientrare: il punteggio resta tuo.</p>
        <button onclick="reconnect()">🔄 Riconnetti</button></div>`;
      break;

    case "lobby": {
      const n = V.players.filter(p => p.online).length;
      html = `<div class="card tabbed"><div class="tab">SALA D'ATTESA</div>
        ${V.isHost
          ? `${scene(90, "bob", `Invita la squadra! Codice <b>${esc(V.code)}</b> o il link nella chat di Meet.`)}
             <button class="sec full" onclick="copyLink()">🔗 Copia link di invito</button>`
          : scene(90, "bob", "Sei dentro! Aspettiamo che l'host faccia partire il caso…")}
        <label>Detective collegati</label>
        <div class="players" id="lobbyPlayers"></div>
        ${V.isHost ? `
          <div class="grid2">
            <div><label for="giri">Giri della partita</label>
              <select id="giri" onchange="send({type:'giri', n:Number(this.value)})">
                ${[1,2,3,4,5].map(g => `<option value="${g}" ${V.giri === g ? "selected" : ""}>${giriLabel(g, n)}</option>`).join("")}
              </select></div>
            <div><label for="dur">Durata dello zoom</label>
              <select id="dur" onchange="send({type:'duration', ms:Number(this.value)})">
                ${[20,30,45,60].map(s => `<option value="${s*1000}" ${V.duration === s*1000 ? "selected" : ""}>${s} secondi</option>`).join("")}
              </select></div>
          </div>
          <p class="muted" style="font-size:14px;margin:8px 0 0">In un giro ognuno sceglie un'immagine una volta.</p>
          <div class="spacer"></div>
          <button class="full" id="startBtn" onclick="send({type:'start'})">▶ Inizia partita</button>
          <p class="muted center" id="startHint" style="font-size:14px;margin:10px 0 0"></p>`
        : `<p class="muted center" id="settingsInfo" style="margin-top:14px"></p>`}
      </div>`;
      break;
    }

    case "upload":
      if (isLead){
        html = `<div class="card tabbed"><div class="tab red">IL TUO TURNO</div>
          ${turnPill()}
          <h2>🎨 Tocca a te!</h2>
          <p class="muted">Scegli una foto, poi tocca il punto da cui partirà lo zoom: più il dettaglio è strano, più sarà difficile.</p>
          <div class="btn file-btn sec full">📷 ${draft ? "Cambia immagine" : "Scegli immagine"}
            <input type="file" accept="image/*" onchange="pickFile(this)"></div>
          <div id="draftArea"></div>
        </div>`;
      } else {
        html = `<div class="card center">
          ${turnPill()}
          ${scene(110, "peek", `Shh… <b>${lead}</b> sta nascondendo un indizio!`)}
          <h2>⏳ ${lead} sta scegliendo un'immagine…</h2>
          <p class="muted">Tieniti pronto: appena parte, scrivi la tua ipotesi il prima possibile.</p>${hostSkip}</div>`;
      }
      break;

    case "countdown":
      html = `<div class="card center">
        ${turnPill()}
        <h2>Preparati, detective!</h2>
        <p class="muted">Immagine di <b>${lead}</b></p>
        <div class="cdring" id="cd">3</div>
        ${!images[r.n] ? `<p class="muted">Sto ricevendo l'immagine…</p>` : ""}${hostSkip}</div>`;
      break;

    case "zoom": {
      const canGuess = !isLead && !r.myGuess;
      html = `<div class="card">
        <div class="row" style="justify-content:space-between">${turnPill()}<span class="muted" style="flex:0 0 auto;margin-bottom:12px;font-size:15px">Immagine di <b>${lead}</b></span></div>
        ${images[r.n] ? `<div class="stage" id="stage"><div class="img" id="stageImg"></div><div class="vignette"></div></div>` : `<p class="center muted">Sto ricevendo l'immagine…</p>`}
        <div class="bar" id="barWrap"><div id="bar"></div></div>
        <div class="stat"><span>⏱ <b id="tleft">–</b></span><span>${isLead ? "" : `Punti in palio: <b id="pnow">100</b>`}</span></div>
        ${canGuess ? `<div class="guess"><input id="gin" type="text" maxlength="60" autocomplete="off" placeholder="La tua ipotesi…">
          <button onclick="sendGuess()">Invia</button></div>
          <p class="muted" style="font-size:14px;margin:8px 0 0">Una sola risposta: più sei veloce, più punti fai!</p>` : ""}
        ${r.myGuess ? `<div class="note">🕵️ Hai risposto <b>“${esc(r.myGuess.text)}”</b> dopo ${secs(r.myGuess.t)}. Ora aspetta gli altri…</div>` : ""}
        ${isLead ? `<div class="note">È la tua immagine: goditi le facce degli altri 😄 Alla fine valuterai le risposte.</div>` : ""}
        <label>Hanno già risposto</label><div class="players" id="answered"></div>
        ${hostSkip}
      </div>`;
      break;
    }

    case "judge":
      if (isLead){
        judgeMarks = {};
        html = `<div class="card tabbed"><div class="tab red">VERDETTO</div>
          ${turnPill()}
          <h2>⚖️ Valuta le risposte</h2>
          ${r.answer ? `<p>La risposta era: <span class="answer">${esc(r.answer)}</span></p>` : ""}
          <p class="muted" style="font-size:14px">✅ giusta = 50–100 punti · 🟡 vicina = 20–40 punti · più è veloce, più punti.</p>
          <ul class="glist" id="judgeList"></ul>
          <button class="full" onclick="sendJudge()">🔨 Conferma i punteggi</button>
        </div>`;
      } else {
        html = `<div class="card">
          ${turnPill()}
          ${images[r.n] ? `<div class="stage" id="stage"><div class="img" id="stageImg"></div></div>` : ""}
          <div class="spacer"></div>
          ${scene(80, "peek", `Tempo scaduto! <b>${lead}</b> sta esaminando le risposte…`)}
          ${r.myGuess ? `<p class="center muted">La tua risposta: <b>“${esc(r.myGuess.text)}”</b></p>` : `<p class="center muted">Non hai risposto in tempo.</p>`}
          ${hostSkip}
        </div>`;
      }
      break;

    case "results": {
      const canNext = isLead || V.isHost;
      const list = (r.guesses || []).slice().sort((a,b) => b.pts - a.pts || a.t - b.t);
      const stampTxt = { ok:"Risolto!", near:"Quasi!", no:"Pista falsa" };
      html = `<div class="card">
        ${turnPill()}
        ${images[r.n] ? `<div class="stage" id="stage"><div class="img" id="stageImg"></div></div>` : ""}
        <h2 class="center" style="margin-top:16px">${r.answer ? `Era: <span class="answer">${esc(r.answer)}</span>` : "Risultati del turno"}</h2>
        <p class="center muted">Immagine di ${lead}</p>
        ${list.length ? `<ul class="glist">${list.map((g, i) => `<li><div class="top">
            <span><b>${esc(g.name)}</b> <span class="muted">· ${secs(g.t)}</span></span>
            <span class="stamp ${g.mark} stamp-in" style="animation-delay:${.15 + i * .18}s;animation-fill-mode:both">${stampTxt[g.mark] || ""}</span></div>
            <div class="top"><div class="txt">“${esc(g.text)}”</div><span class="gain ${g.mark}">+${g.pts}</span></div></li>`).join("")}</ul>`
          : `<p class="center muted">Nessuno ha risposto 🙈</p>`}
        ${canNext
          ? `<button class="full" onclick="send({type:'next'})">${V.isLast ? "🏁 Classifica finale" : "Prossimo turno ▶"}</button>`
          : `<p class="center muted">${V.isLast ? "In attesa della classifica finale…" : "In attesa del prossimo turno…"}</p>`}
      </div>`;
      break;
    }

    case "final": {
      const ranked = V.players.slice().sort((a,b) => b.score - a.score);
      const [p1, p2, p3] = ranked;
      const col = (p, cls, medal, delay) => p ? `<div class="col ${cls} rise" style="animation-delay:${delay}s">
          <div class="medal">${medal}</div><div class="who">${esc(p.name)}${p.id === V.you ? " (tu)" : ""}</div>
          <div class="block">${p.score}</div></div>` : `<div class="col"></div>`;
      const me1 = ranked.findIndex(p => p.id === V.you) + 1;
      html = `<div class="card tabbed center"><div class="tab teal">CASO CHIUSO</div>
        ${scene(130, "cheer", p1 ? `Caso risolto! Il miglior detective è <b>${esc(p1.name)}</b>! 🎉` : "Caso chiuso!")}
        <div class="podium">${col(p2, "p2", "🥈", .5)}${col(p1, "p1", "🥇", .9)}${col(p3, "p3", "🥉", .2)}</div>
        ${me1 ? `<p class="muted" style="margin-top:12px">Sei arrivato <b>${me1}°</b> su ${ranked.length}</p>` : ""}
        ${V.isHost
          ? `<div class="spacer"></div><button class="full" onclick="send({type:'newGame'})">🔁 Nuova partita</button>`
          : `<p class="muted">In attesa che l'host avvii una nuova partita…</p>`}
      </div>`;
      break;
    }
  }
  $("#main").innerHTML = html;

  const st = $("#stage");
  if (st && r && images[r.n]){
    sizeStage(st, r.w, r.h);
    const img = $("#stageImg");
    img.style.backgroundImage = `url("${images[r.n]}")`;
    img.style.transformOrigin = `${r.fx*100}% ${r.fy*100}%`;
    img.style.transform = V.phase === "zoom" ? `scale(${ZOOM_MAX})` : "scale(1)";
  }
  if (V.phase === "upload" && isLead) renderDraft();
  if (V.phase === "judge" && isLead) renderJudge();
  const gin = $("#gin");
  if (gin){ gin.addEventListener("keydown", e => { if (e.key === "Enter") sendGuess(); }); setTimeout(() => gin.focus(), 50); }

  $("#side").innerHTML = ["lost","left","migrating","final"].includes(V.phase) ? (V.phase === "final" ? `<div class="card"><h2>📋 Classifica completa</h2><ul class="scores" id="scores"></ul></div>` : "")
    : `<div class="card"><h2>🏆 Classifica</h2><ul class="scores" id="scores"></ul></div>`;
}

function sizeStage(el, w, h){
  const ratio = (w || 1) / (h || 1);
  el.style.aspectRatio = `${w} / ${h}`;
  el.style.width = `min(100%, calc(55vh * ${ratio.toFixed(4)}))`;
}

function updateDynamic(){
  if (!V || !V.players) return;
  const r = V.round;
  const online = V.players.filter(p => p.online).length;
  const lp = $("#lobbyPlayers");
  if (lp) lp.innerHTML = V.players.map(p => `<span class="pl ${p.online ? "" : "off"}">${p.id === "host" ? "👑 " : "🕵️ "}${esc(p.name)}${p.id === V.you ? " (tu)" : ""}</span>`).join("");
  const sb = $("#startBtn");
  if (sb){
    sb.disabled = online < 2;
    $("#startHint").textContent = online < 2 ? "Serve almeno un altro giocatore per iniziare." : `${online} detective pronti · ${V.giri * online} turni in tutto`;
  }
  const gs = $("#giri");
  if (gs) [...gs.options].forEach(o => { o.textContent = giriLabel(Number(o.value), online); });
  const si = $("#settingsInfo");
  if (si) si.textContent = `Partita da ${giriLabel(V.giri, online)} · zoom di ${V.duration / 1000} secondi`;
  const ans = $("#answered");
  if (ans && r){
    const others = V.players.filter(p => p.id !== r.leadId && (p.online || r.guessed.includes(p.id)));
    ans.innerHTML = others.map(p => { const d = r.guessed.includes(p.id);
      return `<span class="pl ${d ? "done" : "wait"} ${p.online ? "" : "off"}">${d ? "✅ " : "🤔 "}${esc(p.name)}</span>`; }).join("");
  }
  const sc = $("#scores");
  if (sc){
    const sorted = V.players.slice().sort((a,b) => b.score - a.score);
    sc.innerHTML = sorted.map((p,i) => `<li class="${p.online ? "" : "off"}">
      <span style="display:flex;align-items:center;min-width:0"><span class="rank ${p.score > 0 && i < 3 ? "g" + (i+1) : ""}">${i+1}</span>
        <span>${esc(p.name)}${p.id === V.you ? " <span class='muted'>(tu)</span>" : ""}${r && p.id === r.leadId && !["lobby","final"].includes(V.phase) ? " 🎨" : ""}${p.online ? "" : " <span class='muted'>· offline</span>"}</span></span>
      <span style="flex:0 0 auto"><span class="pts">${p.score}</span>${V.isHost && p.id !== "host" ? ` <button class="sec small kick" title="Togli dalla partita" data-id="${p.id}" data-name="${esc(p.name)}" onclick="kickPlayer(this.dataset.id, this.dataset.name)">✕</button>` : ""}</span></li>`).join("");
  }
}

/* ---------- Upload del lead ---------- */
async function pickFile(input){
  const file = input.files && input.files[0];
  if (!file) return;
  try{
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.src = url;
    await img.decode();
    let w = img.naturalWidth, h = img.naturalHeight;
    const s = Math.min(1, MAX_SIDE / Math.max(w, h));
    w = Math.round(w*s); h = Math.round(h*s);
    const c = document.createElement("canvas"); c.width = w; c.height = h;
    c.getContext("2d").drawImage(img, 0, 0, w, h);
    URL.revokeObjectURL(url);
    const prevAnswer = draft ? draft.answer : "";
    draft = { dataUrl:c.toDataURL("image/jpeg", 0.82), w, h, fx:0.5, fy:0.5, answer:prevAnswer };
    screenKey = ""; render();
  }catch(e){
    console.warn(e);
    toast("Non riesco ad aprire questa immagine. Prova con una JPG o PNG.");
  }
}

function renderDraft(){
  const area = $("#draftArea");
  if (!area || !draft) return;
  area.innerHTML = `
    <div class="two" style="margin-top:16px">
      <div>
        <p class="mini-title">👆 Tocca il punto di partenza dello zoom</p>
        <div class="stage pick" id="pickStage"><div class="img" id="pickImg"></div><div class="marker" id="marker"></div></div>
      </div>
      <div>
        <p class="mini-title">🔍 Cosa vedranno all'inizio</p>
        <div class="stage" id="prevStage"><div class="img" id="prevImg"></div><div class="vignette"></div></div>
      </div>
    </div>
    <label for="ans">Cos'è? (opzionale, lo vedrai solo tu fino alla fine)</label>
    <input id="ans" type="text" maxlength="60" autocomplete="off" placeholder="Es. la grattugia di mia nonna" value="${esc(draft.answer)}">
    <div class="spacer"></div>
    <button class="full red" onclick="startRound()">🚀 Via!</button>`;
  const ps = $("#pickStage"), pv = $("#prevStage");
  sizeStage(ps, draft.w, draft.h); sizeStage(pv, draft.w, draft.h);
  ps.style.width = "100%"; pv.style.width = "100%";
  $("#pickImg").style.backgroundImage = $("#prevImg").style.backgroundImage = `url("${draft.dataUrl}")`;
  const place = () => {
    $("#marker").style.left = draft.fx*100 + "%"; $("#marker").style.top = draft.fy*100 + "%";
    const pi = $("#prevImg");
    pi.style.transformOrigin = `${draft.fx*100}% ${draft.fy*100}%`;
    pi.style.transform = `scale(${ZOOM_MAX})`;
  };
  place();
  ps.addEventListener("click", e => {
    const b = ps.getBoundingClientRect();
    draft.fx = clamp((e.clientX - b.left) / b.width, 0, 1);
    draft.fy = clamp((e.clientY - b.top) / b.height, 0, 1);
    place();
  });
  $("#ans").addEventListener("input", e => { draft.answer = e.target.value; });
}

function startRound(){
  if (!draft) return;
  send({ type:"upload", image:draft.dataUrl, w:draft.w, h:draft.h, fx:draft.fx, fy:draft.fy, answer:draft.answer });
  draft = null;
}

/* ---------- Risposte ---------- */
function sendGuess(){
  const el = $("#gin"); if (!el) return;
  const text = el.value.trim();
  if (!text){ el.focus(); return; }
  send({ type:"guess", text });
  el.disabled = true;
}

/* ---------- Giudizio ---------- */
function renderJudge(){
  const ul = $("#judgeList"); if (!ul) return;
  const list = V.round.guesses || [];
  if (!list.length){ ul.innerHTML = `<li class="center muted">Nessuno ha risposto 🙈</li>`; return; }
  ul.innerHTML = list.map(g => {
    const m = judgeMarks[g.id] || "no";
    const b = (k, label) => `<button class="${k} ${m === k ? "on" : ""}" onclick="setMark('${g.id}','${k}')">${label}</button>`;
    return `<li><div class="top"><span><b>${esc(g.name)}</b> <span class="muted">· ${secs(g.t)}</span></span>
      <span class="gain ${m}">${m === "no" ? "0" : "+" + points(m, g.t, V.duration)}</span></div>
      <div class="txt">“${esc(g.text)}”</div>
      <div class="marks">${b("ok","✅ Giusta")}${b("near","🟡 Vicina")}${b("no","❌ Sbagliata")}</div></li>`;
  }).join("");
}
function setMark(id, k){ judgeMarks[id] = k; renderJudge(); }
function sendJudge(){ send({ type:"judge", marks:judgeMarks }); }

function reconnect(){ connecting = true; V = null; screenKey = ""; homeError = ""; renderHome(); connectToHost(); }

/* ---------- Animazione ---------- */
let lastCd = 0, lastSec = 0;
function tick(){
  requestAnimationFrame(tick);
  if (!V || !V.round) return;
  const now = performance.now();
  if (V.phase === "zoom"){
    const el = $("#stageImg");
    const elapsed = now - zoomAnchor.start;
    const p = clamp(elapsed / V.duration, 0, 1);
    if (el) el.style.transform = `scale(${Math.pow(ZOOM_MAX, 1 - p)})`;
    const total = V.duration + GRACE_MS;
    const left = Math.max(0, total - elapsed);
    const bar = $("#bar"); if (bar) bar.style.width = (left / total * 100) + "%";
    const bw = $("#barWrap"); if (bw) bw.classList.toggle("low", left < 6000);
    const sec = Math.ceil(left / 1000);
    const tl = $("#tleft"); if (tl) tl.textContent = sec + " s";
    const pn = $("#pnow"); if (pn) pn.textContent = points("ok", elapsed, V.duration);
    if (sec !== lastSec){ if (sec > 0 && sec <= 5 && !(V.round.myGuess) && V.round.leadId !== V.you) sfx.tick(); lastSec = sec; }
  } else if (V.phase === "countdown"){
    const cd = $("#cd");
    const n = Math.max(1, Math.ceil((cdAnchor.end - now) / 1000));
    if (cd && cd.textContent !== String(n) || (cd && n !== lastCd)){
      cd.textContent = n; cd.classList.remove("pop"); void cd.offsetWidth; cd.classList.add("pop");
      if (n !== lastCd) sfx.beep();
      lastCd = n;
    }
  } else { lastCd = 0; }
}
requestAnimationFrame(tick);

$("#logoMascot").innerHTML = MASCOTS[MASCOT_CHOICE] || "";
$("#muteBtn").textContent = sfx.muted ? "🔇" : "🔊";
renderHome();
</script>
</body>
